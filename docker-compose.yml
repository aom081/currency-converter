services:
  app:
    build:
      context: .
      args:
        VITE_RATES_URL: ${VITE_RATES_URL:-https://open.er-api.com/v6/latest/USD}
        VITE_HISTORY_URL: ${VITE_HISTORY_URL:-https://api.frankfurter.dev/v1}
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
